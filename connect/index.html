<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect with Ishra Dance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      border: 4px solid #000000;
      border-radius: 8px;
      box-shadow: 6px 6px 0px #000000;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 8px;
      color: #000000;
    }
    p {
      font-size: 14px;
      color: #333333;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #000000;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 2px solid #000000;
      border-radius: 4px;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: #ff0055;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #000000;
      color: #ffe600;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover {
      background: #222222;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Are You a Dance Lover?</h1>
    <p>Drop your contact details below to claim your free workshop passes and session invites.</p>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <!-- Hidden referral fields -->
      <input type="hidden" name="promoter_id" id="promoter_id" value="DIRECT" />
      <input type="hidden" name="campaign_source" id="campaign_source" value="car_sticker" />

      <label for="phone">Phone / WhatsApp (Required)</label>
      <input type="tel" name="phone" id="phone" placeholder="+91 98765 43210" required />

      <label for="email">Email Address</label>
      <input type="email" name="email" id="email" placeholder="you@example.com" />

      <button type="submit">Claim Free Pass</button>
    </form>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get("ref");
      const utm = urlParams.get("utm_source");

      if (ref) document.getElementById("promoter_id").value = ref;
      if (utm) document.getElementById("campaign_source").value = utm;
    });
  </script>
</body>
</html>
